name: Bug report
description: Something renders or behaves incorrectly
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: react-native-mantine version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: React Native / Expo SDK version, platform(s), New Architecture on or off
      placeholder: "Expo 54, RN 0.81, iOS 18 simulator, new arch enabled"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code, or a Snack link (https://snack.expo.dev)
      render: tsx
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
